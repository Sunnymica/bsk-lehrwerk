<!DOCTYPE html>
<html lang="de">
<head>

<title>Nachschlagen – Berufssprachkurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-bereich="referenz">

<div class="band">
  <p class="eyebrow" id="band-titel">Kursbeginn</p>
  <ul class="uhr" id="uhr">
    <li><span class="zahl" data-feld="tage">–</span><span class="einheit">Tage</span></li>
    <li><span class="zahl" data-feld="stunden">–</span><span class="einheit">Stunden</span></li>
    <li><span class="zahl" data-feld="minuten">–</span><span class="einheit">Minuten</span></li>
    <li><span class="zahl" data-feld="sekunden">–</span><span class="einheit">Sekunden</span></li>
  </ul>
  <p class="fussnote" id="band-fussnote"></p>
  <div class="fortschritt" id="fortschritt" hidden>
    <div class="schiene"><div class="balken" id="balken"></div></div>
    <p id="fortschritt-text"></p>
  </div>
</div>

<header class="hero bereich-kopf">
  <div class="innen">
    <a class="zurueck" href="index.html">← Übersicht</a>
    <h1 id="bereich-titel"><em>Nachschlagen</em></h1>
    <p class="anleitung" id="bereich-text"></p>
    <button class="knopf" id="alle-auf" type="button" hidden>Alle aufklappen</button>
  </div>
</header>

<main class="innen gruppen" id="gruppen"></main>
<div class="innen meldung" id="meldung" hidden></div>

<footer class="fuss">Nur für Kursteilnehmerinnen und Kursteilnehmer</footer>
