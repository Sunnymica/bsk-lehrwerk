<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Trennbare Verben · Sprachwerkstatt</title><style>:root{font-family:system-ui,"Segoe UI",sans-serif;color:#203143;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:930px;margin:auto;padding:24px}.eyebrow{color:#b03f62;font-size:.77rem;font-weight:700;letter-spacing:.08em}.muted{color:#526578}h1{margin:.3em 0}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}button,select{font:inherit;padding:11px 15px;border:1px solid #cbd8e0;border-radius:10px;background:white;color:#203143;cursor:pointer}button[aria-pressed=true],button.primary{color:white;background:#245d76;border-color:#245d76}.card{padding:24px;background:#fff;border:1px solid #dce5eb;border-radius:16px}.rule{border-left:4px solid #bc4d70;background:#fff6f8;padding:14px 17px;line-height:1.5}.task{font-size:clamp(1.35rem,3.5vw,2rem);line-height:1.35;background:#f0f4f7;padding:22px;border-radius:12px;font-weight:700;min-height:108px;margin:19px 0}.answer{background:#ebf5f8;border-left:4px solid #26758b;border-radius:9px;padding:18px;margin:18px 0;font-size:1.2rem}.controls{display:flex;flex-wrap:wrap;gap:9px}.meta{display:flex;justify-content:space-between;font-weight:650;color:#526578}.notice{color:#b03f62}button:disabled{opacity:.45}button:focus-visible,select:focus-visible{outline:3px solid #c54e71;outline-offset:2px}[hidden]{display:none!important}a{color:#245d76}@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}}</style></head><body><main class="wrap"><a href="../pauken.html">← Pauken</a><p class="eyebrow">DEUTSCH FÜRS BÜRO · SPRACHWERKSTATT</p><h1>Trennbare Verben am Empfang</h1><p class="muted">Drei Serien à zehn Aufgaben – zwei Runden für fünf Teilnehmende. Erst selbst formulieren, dann die Lösung aufdecken.</p><nav class="tabs" id="tabs" aria-label="Übungsserien"></nav><section class="card"><div class="meta"><span id="count"></span><span id="clock" class="notice"></span></div><h2 id="heading"></h2><p id="rule" class="rule"></p><p class="eyebrow" id="instruction"></p><div class="task" id="task"></div><div class="answer" id="answer" hidden aria-live="polite"></div><div class="controls"><button id="prev">← Zurück</button><button id="show" class="primary">Lösung zeigen</button><button id="next">Weiter →</button></div><p class="muted">Leertaste: Lösung zeigen · Pfeiltasten: vor/zurück (außer auf Bedienelementen).</p></section><p><label for="timer">Denkzeit: </label><select id="timer"><option value="0">ohne Uhr</option><option value="15">15 Sekunden</option><option value="20">20 Sekunden</option><option value="30">30 Sekunden</option></select></p></main><script>"use strict";const sets=[{"title":"1 · Hauptsatz","hint":"Das konjugierte Verb steht auf Position 2. Bei trennbaren Verben steht der Verbzusatz am Satzende.","items":[["Nora / Anrufe / annehmen","Nora nimmt Anrufe an."],["Frau Lenz / Besucher / anmelden","Frau Lenz meldet Besucher an."],["Jonas / eine Nachricht / aufnehmen","Jonas nimmt eine Nachricht auf."],["Nora / den Anrufer / weiterverbinden","Nora verbindet den Anrufer weiter."],["Pawel / die Nachricht / weiterleiten","Pawel leitet die Nachricht weiter."],["Nora / die Lieferscheine / abheften","Nora heftet die Lieferscheine ab."],["Frau Lenz / Büromaterial / nachbestellen","Frau Lenz bestellt Büromaterial nach."],["Am Montag / Nora / die Anrufe / annehmen","Am Montag nimmt Nora die Anrufe an."],["Heute / Jonas / den Besucher / anmelden","Heute meldet Jonas den Besucher an."],["Nach dem Telefonat / Nora / die Nachricht / weiterleiten","Nach dem Telefonat leitet Nora die Nachricht weiter."]]},{"title":"2 · Zusammen oder getrennt?","hint":"Mit Modalverb steht der Infinitiv am Ende: annehmen. Im Perfekt steht bei diesen Verben ge im Verb: angenommen. Im Nebensatz steht das konjugierte Verb am Ende: annimmt.","items":[["Nora / den Anruf / annehmen müssen (Modalverb)","Nora muss den Anruf annehmen."],["Frau Lenz / die Besucher / anmelden können (Modalverb)","Frau Lenz kann die Besucher anmelden."],["Jonas / die Nachricht / aufnehmen sollen (Modalverb)","Jonas soll die Nachricht aufnehmen."],["Nora / den Anruf / annehmen (Perfekt)","Nora hat den Anruf angenommen."],["Frau Lenz / den Besucher / anmelden (Perfekt)","Frau Lenz hat den Besucher angemeldet."],["Pawel / die Nachricht / weiterleiten (Perfekt)","Pawel hat die Nachricht weitergeleitet."],["Nora sagt, dass sie / die Lieferscheine / abheften","Nora sagt, dass sie die Lieferscheine abheftet."],["Jonas fragt, ob Nora / Büromaterial / nachbestellen","Jonas fragt, ob Nora Büromaterial nachbestellt."],["Frau Lenz erklärt, warum sie / den Anrufer / weiterverbinden","Frau Lenz erklärt, warum sie den Anrufer weiterverbindet."],["Nora / die Lieferscheine / abheften wollen (Modalverb)","Nora will die Lieferscheine abheften."]]},{"title":"3 · Fehlerwerkstatt","hint":"Korrigieren Sie den Fehler oder sagen Sie „richtig“. Achtung: „verteilen“, „frankieren“ und „bestellen“ sind keine trennbaren Verben.","items":[["Ich annehme den Anruf.","Ich nehme den Anruf an."],["Nora meldet an den Besucher.","Nora meldet den Besucher an."],["Jonas will die Nachricht leiten weiter.","Jonas will die Nachricht weiterleiten."],["Frau Lenz hat den Besucher angemeldet.","Richtig."],["Nora hat die Nachricht geweiterleitet.","Nora hat die Nachricht weitergeleitet."],["Weil Nora die Anrufe nimmt an, hat sie keine Zeit.","Weil Nora die Anrufe annimmt, hat sie keine Zeit."],["Pawel bestellt das Büromaterial nach.","Richtig."],["Heute heftet Nora ab die Lieferscheine.","Heute heftet Nora die Lieferscheine ab."],["Frau Lenz teilt die Post ver.","Frau Lenz verteilt die Post. „ver-“ ist nie trennbar."],["Nora frankiert die Briefe.","Richtig. „frankieren“ ist nicht trennbar."]]}];const $=id=>document.getElementById(id);let g=0,i=0,interval=null;sets.forEach((s,n)=>{let b=document.createElement("button");b.type="button";b.textContent=s.title;b.onclick=()=>{g=n;i=0;draw()};$("tabs").append(b)});function draw(){clearInterval(interval);let s=sets[g],q=s.items[i];$("heading").textContent=s.title;$("rule").textContent=s.hint;$("instruction").textContent=g===2?"Korrigieren Sie – oder sagen Sie: Der Satz ist richtig.":"Bilden Sie einen vollständigen Satz.";$("count").textContent="Runde "+(i<5?1:2)+" · Aufgabe "+(i+1)+" / 10";$("task").textContent=q[0];$("answer").textContent=q[1];$("answer").hidden=true;$("show").textContent="Lösung zeigen";$("prev").disabled=i===0;[...$("tabs").children].forEach((b,n)=>b.setAttribute("aria-pressed",String(n===g)));let n=Number($("timer").value);$("clock").textContent=n?n+" s":"";if(n)interval=setInterval(()=>{n--;$("clock").textContent=n>0?n+" s":"Zeit!";if(n<=0)clearInterval(interval)},1000)}$("show").onclick=()=>{let v=$("answer").hidden;$("answer").hidden=!v;$("show").textContent=v?"Lösung verbergen":"Lösung zeigen";if(v){clearInterval(interval);$("clock").textContent=""}};$("next").onclick=()=>{if(i<9)i++;else{g=(g+1)%sets.length;i=0}draw()};$("prev").onclick=()=>{if(i>0)i--;draw()};$("timer").onchange=draw;document.addEventListener("keydown",e=>{if(["BUTTON","INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;if(e.code==="Space"){e.preventDefault();$("show").click()}else if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("prev").click()});draw();</script></body></html>
