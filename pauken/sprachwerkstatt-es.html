<body><main class="wrap"><a href="../pauken.html">← Pauken</a><p class="label">DEUTSCH FÜRS BÜRO · SPRACHWERKSTATT</p><h1>Das kleine Wort „es“</h1><p class="muted">Aufgabe vorlesen, Satz bilden, dann die Lösung aufdecken.</p>
<div class="levels" id="levels"><button type="button" data-l="0">Basis<small>Serien 1–4</small></button><button type="button" data-l="1">Vertiefung<small>Serien 5–9</small></button></div>
<nav class="tabs" id="tabs" aria-label="Übungsserien"></nav>
<section class="card"><div class="head"><div class="label" id="count"></div><div class="clock" id="clock" aria-live="polite"></div></div><h2 id="heading"></h2><p id="explain" class="info"></p><p class="label" id="instruction"></p><p class="vorlage" id="vorlage" hidden></p><div class="task" id="task"></div><p class="tipp" id="tipp" hidden></p><div id="answer" class="answer" hidden aria-live="polite"><strong id="solution"></strong><div class="note" id="note"></div></div><div class="controls"><button id="prev">← Zurück</button><button id="tippbtn" type="button">Tipp</button><button id="show" class="main">Lösung zeigen</button><button id="next">Weiter →</button></div><p class="small muted">Leertaste: Lösung zeigen · Pfeiltasten: weiter / zurück</p></section>
<div class="card"><label for="timer">Denkzeit pro Aufgabe: </label><select id="timer"><option value="0">ohne Zeitdruck</option><option value="15">15 Sekunden</option><option value="20">20 Sekunden</option><option value="30">30 Sekunden</option></select><p class="muted small">Tipp für Teams: Erst sprechen alle gleichzeitig oder in Paaren. Dann ein bis zwei Lösungen gemeinsam besprechen.</p></div></main>
<script>
/* Item: q = Aufgabe, a = Lösung, n = Erklärung, v = Ausgangssatz (klein darüber), t = Tipp, b = Beispiel (Lösung sofort sichtbar) */
const levels=[[
{title:"1 · Wetter: regnen, schneien",intro:"Beim Wetter steht immer es: Es regnet. Es schneit.\nDas es bleibt in jeder Zeit: Es hat geregnet. Es wird schneien.\nSteht ein anderes Wort vorn, kommt es hinter das Verb: Heute regnet es.",task:"Lesen Sie vor und bilden Sie den ganzen Satz.",items:[
{b:1,q:"heute / regnen (Präsens)",a:"Heute regnet es.",n:"Heute · regnet · es"},
{q:"es / schneien (Präsens)",a:"Es schneit.",n:"Das es steht vorn."},
{q:"im Winter / oft / schneien (Präsens)",a:"Im Winter schneit es oft.",n:"Im Winter · schneit · es · oft",t:"Im Winter · Verb · es …"},
{q:"gestern / regnen (Perfekt)",a:"Gestern hat es geregnet.",n:"Gestern · hat · es · geregnet",t:"Gestern · hat · es …"},
{q:"letzte Nacht / schneien (Perfekt)",a:"Letzte Nacht hat es geschneit.",n:"Letzte Nacht · hat · es · geschneit",t:"Letzte Nacht · hat · es …"},
{q:"letzte Woche / viel / regnen (Präteritum)",a:"Letzte Woche regnete es viel.",n:"Präteritum: regnete. Im Gespräch sagen wir meist: Letzte Woche hat es viel geregnet.",t:"regnen → regnete"},
{q:"im Januar / stark / schneien (Präteritum)",a:"Im Januar schneite es stark.",n:"Präteritum: schneite",t:"schneien → schneite"},
{q:"morgen / regnen (Futur)",a:"Morgen wird es regnen.",n:"Morgen · wird · es · regnen",t:"Morgen · wird · es …"},
{q:"am Wochenende / schneien (Futur)",a:"Am Wochenende wird es schneien.",n:"Am Wochenende · wird · es · schneien",t:"Am Wochenende · wird · es …"},
{q:"jetzt / nicht mehr / regnen (Präsens)",a:"Jetzt regnet es nicht mehr.",n:"Jetzt · regnet · es · nicht mehr",t:"Jetzt · Verb · es …"}
]},
{title:"2 · Es ist kalt oder mir ist kalt?",intro:"Wetter oder Raum → es: Es ist kalt.\nMein Körper, mein Gefühl → kein es: Mir ist kalt.\nich → mir · du → dir · er → ihm · sie → ihr · wir → uns",task:"Lesen Sie vor und bilden Sie den ganzen Satz.",items:[
{b:1,q:"draußen / kalt (Wetter)",a:"Draußen ist es kalt.",n:"Wetter: es ist kalt."},
{b:1,q:"ich / kalt (mein Gefühl)",a:"Mir ist kalt.",n:"Mein Gefühl: mir ist kalt. Kein es."},
{q:"heute / heiß (Wetter)",a:"Heute ist es heiß.",n:"Wetter: es ist heiß.",t:"Wetter → es"},
{q:"er / heiß (Er hat Fieber.)",a:"Ihm ist heiß.",n:"Sein Gefühl: ihm ist heiß.",t:"er → ihm"},
{q:"im Büro / warm (der Raum)",a:"Im Büro ist es warm.",n:"Raum: es ist warm.",t:"Raum → es"},
{q:"sie / kalt (Nora friert.)",a:"Ihr ist kalt.",n:"Ihr Gefühl: ihr ist kalt.",t:"sie → ihr"},
{q:"im Lager / kalt (der Raum)",a:"Im Lager ist es kalt.",n:"Raum: es ist kalt.",t:"Raum → es"},
{q:"du / kalt? (Frage)",a:"Ist dir kalt?",n:"Dein Gefühl: dir ist kalt.",t:"du → dir"},
{q:"Ich bin kalt. Was ist falsch?",a:"Mir ist kalt.",n:"Ich bin kalt heißt: Ich bin ein kalter Mensch. Ohne Gefühle!",t:"ich → mir"},
{q:"Sie / kalt? (höfliche Frage)",a:"Ist Ihnen kalt?",n:"Höflich: Ihnen ist kalt.",t:"Sie → Ihnen"}
]},
{title:"3 · Es gibt",intro:"es gibt = Das ist da. Das existiert.\nNach es gibt: einen · eine · ein · keinen\nDas Verb bleibt immer gibt, auch im Plural. Das es bleibt immer.",task:"Lesen Sie vor und bilden Sie den ganzen Satz.",items:[
{b:1,q:"im Büro / ein Drucker",a:"Im Büro gibt es einen Drucker.",n:"es gibt + einen Drucker"},
{q:"im Gebäude / ein Aufzug",a:"Im Gebäude gibt es einen Aufzug.",n:"es gibt + einen Aufzug",t:"ein Aufzug → einen Aufzug"},
{q:"bei KONTOR / eine Kantine",a:"Bei KONTOR gibt es eine Kantine.",n:"eine bleibt eine.",t:"eine → eine"},
{q:"heute / drei Besprechungen",a:"Heute gibt es drei Besprechungen.",n:"Auch im Plural: gibt.",t:"gibt bleibt gibt"},
{q:"in der Kantine / kein Kaffee",a:"In der Kantine gibt es keinen Kaffee.",n:"es gibt + keinen Kaffee",t:"kein Kaffee → keinen Kaffee"},
{q:"es gibt / ein Problem mit der Rechnung",a:"Es gibt ein Problem mit der Rechnung.",n:"ein Problem bleibt ein Problem (das Problem).",t:"das Problem → ein Problem"},
{q:"morgen / keine Besprechung",a:"Morgen gibt es keine Besprechung.",n:"Morgen · gibt · es · keine Besprechung",t:"Morgen · gibt · es …"},
{q:"hier / ein Parkplatz? (Frage)",a:"Gibt es hier einen Parkplatz?",n:"Frage: Gibt es …? + einen Parkplatz",t:"Gibt es …?"},
{q:"im Lager / zwei Gabelstapler",a:"Im Lager gibt es zwei Gabelstapler.",n:"Auch im Plural: gibt.",t:"gibt bleibt gibt"},
{q:"in der Abteilung / kein freier Arbeitsplatz",a:"In der Abteilung gibt es keinen freien Arbeitsplatz.",n:"es gibt + keinen freien Arbeitsplatz",t:"kein → keinen"}
]},
{title:"4 · Es bleibt oder es geht?",intro:"Fragen Sie: Wer oder was?\nDie Antwort steht im Satz → es geht weg, wenn ein anderes Wort vorn steht.\nKeine Antwort im Satz → es bleibt.",task:"Sagen Sie den Satz neu. Beginnen Sie so:",items:[
{b:1,v:"Es wartet ein Kunde.",q:"Vor der Tür …",a:"Vor der Tür wartet ein Kunde.",n:"Wer wartet? Ein Kunde. Die Antwort steht im Satz. Das es geht weg."},
{b:1,v:"Es regnet.",q:"Heute …",a:"Heute regnet es.",n:"Wer regnet? Niemand. Keine Antwort im Satz. Das es bleibt."},
{v:"Es kommt eine Lieferung.",q:"Heute …",a:"Heute kommt eine Lieferung.",n:"Was kommt? Eine Lieferung. Das es geht weg.",t:"Was kommt?"},
{v:"Es ist kalt.",q:"Im Lager …",a:"Im Lager ist es kalt.",n:"Was ist kalt? Keine Antwort im Satz. Das es bleibt.",t:"Was ist kalt? Steht die Antwort im Satz?"},
{v:"Es liegen drei Ordner auf dem Tisch.",q:"Auf dem Tisch …",a:"Auf dem Tisch liegen drei Ordner.",n:"Was liegt da? Drei Ordner. Das es geht weg. Auch das Verb zeigt es: liegen, Plural.",t:"Was liegt auf dem Tisch?"},
{v:"Es schneit.",q:"Morgen …",a:"Morgen schneit es.",n:"Wer schneit? Niemand. Das es bleibt.",t:"Wer schneit?"},
{v:"Es ruft Frau Melnyk an.",q:"Morgen …",a:"Morgen ruft Frau Melnyk an.",n:"Wer ruft an? Frau Melnyk. Das es geht weg.",t:"Wer ruft an?"},
{v:"Es gibt eine Besprechung.",q:"Heute …",a:"Heute gibt es eine Besprechung.",n:"Wer gibt? Niemand. Das es bleibt. Bei es gibt bleibt es immer.",t:"Wer gibt?"},
{v:"Es warten zwei Kunden.",q:"Vor der Tür …",a:"Vor der Tür warten zwei Kunden.",n:"Wer wartet? Zwei Kunden. Das es geht weg. Das Verb zeigt es auch: warten, Plural.",t:"Wer wartet?"},
{v:"Es stehen zwei Lieferwagen vor der Halle.",q:"Vor der Halle …",a:"Vor der Halle stehen zwei Lieferwagen.",n:"Wer steht da? Zwei Lieferwagen. Das es geht weg.",t:"Wer steht vor der Halle?"}
]}],[
{title:"5 · Es gibt oder da ist?",intro:"es gibt + ein / eine / kein → Das ist neu. Der andere weiß es noch nicht.\nda ist / da sind + der / die / das → Man sieht es. Oder man kennt es schon.",task:"Lesen Sie vor und bilden Sie den ganzen Satz.",items:[
{b:1,q:"Herr Müller weiß noch nichts. Sie sagen: eine neue Lieferung.",a:"Es gibt eine neue Lieferung, Herr Müller.",n:"Neu für Herrn Müller: es gibt."},
{b:1,q:"Herr Müller steht mit Ihnen im Lager. Sie zeigen auf die Lieferung.",a:"Da ist die neue Lieferung, Herr Müller.",n:"Sie sehen sie: da ist."},
{q:"Neu für Ihre Chefin: ein Problem mit der Rechnung",a:"Es gibt ein Problem mit der Rechnung.",n:"Neu: es gibt."},
{q:"Sie suchen den Schlüssel. Jetzt sehen Sie ihn.",a:"Da ist der Schlüssel!",n:"Sie sehen ihn: da ist.",t:"Sie sehen ihn → da …"},
{q:"Pawel wartet auf die Pakete. Sie sehen die Pakete.",a:"Da sind die Pakete!",n:"Plural: da sind.",t:"die Pakete (Plural) → da …"},
{q:"Herr Müller hat die Lieferung bestellt. Sie sagen: Es gibt die bestellte Lieferung. Wie sagen Sie es besser?",a:"Die bestellte Lieferung ist da. / Da ist die bestellte Lieferung.",n:"Die Lieferung ist schon bekannt: nicht es gibt. Ist da heißt hier: ist angekommen."},
{q:"Neu für das Team: eine neue Kollegin",a:"Es gibt eine neue Kollegin.",n:"Neu: es gibt."},
{q:"Nora fragt: Wo sind die Ordner? Sie zeigen darauf.",a:"Da sind die Ordner.",n:"Sie sehen sie: da sind.",t:"die Ordner (Plural) → da …"},
{q:"Sie suchen Ihre Brille. Jetzt sehen Sie sie.",a:"Da ist meine Brille!",n:"Sie sehen sie: da ist."},
{q:"Neu für Pawel: im Lager / keine Kartons mehr",a:"Im Lager gibt es keine Kartons mehr.",n:"Neue Information: es gibt + keine."}
]},
{title:"6 · Ankündigungswort",intro:"es kündigt einen dass-Satz an: Es ist wichtig, dass …\nSteht der dass-Satz vorn → kein es: Dass …, ist wichtig.",task:"Ergänzen oder sagen Sie den Satz neu.",items:[
{b:1,v:"Es ist wichtig, dass alle pünktlich kommen.",q:"Dass …",a:"Dass alle pünktlich kommen, ist wichtig.",n:"Der dass-Satz steht vorn: kein es."},
{q:"___ freut mich, dass Sie Zeit haben.",a:"Es freut mich, dass Sie Zeit haben.",n:"Es kündigt an, was mich freut."},
{v:"Dass Sie anrufen, ist gut.",q:"Es …",a:"Es ist gut, dass Sie anrufen.",n:"Der dass-Satz folgt hinten, es kündigt ihn an."},
{q:"Dass die Lieferung schon da ist, ist es super. Was ist falsch?",a:"Dass die Lieferung schon da ist, ist super.",n:"Der dass-Satz steht schon vorn. Das es muss weg.",t:"Wo steht der dass-Satz?"},
{q:"Sie sagen Frau Melnyk höflich ab: ___ ist mir leider nicht möglich, morgen zu kommen.",a:"Es ist mir leider nicht möglich, morgen zu kommen.",n:"Es kündigt an: morgen zu kommen."},
{v:"Es ärgert Pawel, dass der Termin ausfällt.",q:"Dass …",a:"Dass der Termin ausfällt, ärgert Pawel.",n:"Der dass-Satz steht vorn, das es fällt weg."},
{q:"Ich finde es wichtig, dass wir uns abstimmen. Was kündigt es an?",a:"Den dass-Satz: dass wir uns abstimmen.",n:"Hier steht das Ankündigungswort hinter dem Verb."},
{q:"___ ist gut, dass Sie uns Bescheid sagen.",a:"Es ist gut, dass Sie uns Bescheid sagen.",n:"Es kündigt den dass-Satz an."},
{v:"Es ist schade, dass die Besprechung ausfällt.",q:"Dass …",a:"Dass die Besprechung ausfällt, ist schade.",n:"Der dass-Satz steht vorn: kein es."},
{v:"Dass Nora pünktlich antwortet, ist hilfreich.",q:"Es …",a:"Es ist hilfreich, dass Nora pünktlich antwortet.",n:"Der dass-Satz folgt hinten, es kündigt ihn an."}
]},
{title:"7 · Es auf Platz 1?",intro:"Als Subjekt darf es vorn stehen: Es liegt im Lager.\nAls Akkusativ darf es nicht vorn stehen.\nDann: Ich habe es gelesen. Oder: Das habe ich gelesen.",task:"Was ist richtig? Sagen Sie den Satz.",items:[
{b:1,q:"Das Protokoll? Es habe ich gestern gelesen.",a:"Ich habe es gestern gelesen. / Das habe ich gestern gelesen.",n:"Akkusativ-es nicht auf Platz 1."},
{q:"Das Paket? Es ist schon im Lager. Richtig oder falsch?",a:"Richtig.",n:"Hier ist es Subjekt. Das darf vorn stehen.",t:"Wer oder was ist im Lager?"},
{q:"Das Formular? Es hat Nora schon unterschrieben.",a:"Nora hat es schon unterschrieben. / Das hat Nora schon unterschrieben.",n:"Es ist hier Akkusativ: nicht auf Platz 1.",t:"Wer unterschreibt? Nora. Also ist es …"},
{q:"Das Angebot? Es schicke ich morgen.",a:"Ich schicke es morgen. / Das schicke ich morgen.",n:"Akkusativ-es hinter das Verb."},
{q:"Das Fenster? Es ist offen. Richtig oder falsch?",a:"Richtig.",n:"Es ist Subjekt, Platz 1 ist in Ordnung."},
{q:"Das Problem? ___ kennen wir schon. (betont, vorn)",a:"Das kennen wir schon.",n:"Vorn steht das betonte das."},
{q:"Das Dokument? Gestern hat Nora ___ mir geschickt.",a:"Gestern hat Nora es mir geschickt.",n:"Zwei Pronomen: es vor mir."},
{q:"Das Problem? Wir kennen ___ schon. (unbetont)",a:"Wir kennen es schon.",n:"Unbetont: es steht hinter dem Verb."},
{q:"Das Formular? Es muss heute abgegeben werden. Richtig oder falsch?",a:"Richtig.",n:"Hier ist es Subjekt und darf vorn stehen."},
{q:"Das Paket? Es bringt Pawel gleich.",a:"Pawel bringt es gleich. / Das bringt Pawel gleich.",n:"Akkusativ-es nicht auf Platz 1.",t:"Wer bringt? Pawel. Also ist es …"}
]},
{title:"8 · Bleibt es?",intro:"Gemischt: Muss es bleiben? Muss es weg? Oder fehlt es?",task:"Was ist falsch? Sagen Sie den richtigen Satz.",items:[
{b:1,q:"Morgen es schneit.",a:"Morgen schneit es.",n:"Verb auf Platz 2. Das Wetter-es bleibt, aber hinter dem Verb."},
{q:"Morgen es kommt Frau Melnyk.",a:"Morgen kommt Frau Melnyk.",n:"Frau Melnyk ist das Subjekt. Kein es."},
{q:"Hier es gibt einen Kopierer.",a:"Hier gibt es einen Kopierer.",n:"Verb auf Platz 2, das es von es gibt dahinter."},
{q:"Heute scheint es die Sonne.",a:"Heute scheint die Sonne.",n:"Die Sonne ist das Subjekt. Kein es."},
{q:"Pawel sagt, dass heute regnet.",a:"Pawel sagt, dass es heute regnet.",n:"Das Wetter-es fehlt. Es bleibt auch im Nebensatz."},
{v:"Es wartet ein Kunde.",q:"Jonas sagt, dass …",a:"Jonas sagt, dass ein Kunde wartet.",n:"Im Nebensatz fällt das Platzhalter-es weg."},
{v:"Es ist schön, dass Sie mitkommen.",q:"Dass …",a:"Dass Sie mitkommen, ist schön.",n:"Der dass-Satz steht vorn: kein es."},
{q:"Im Büro es gibt noch freie Plätze.",a:"Im Büro gibt es noch freie Plätze.",n:"Verb auf Platz 2. Das es von es gibt bleibt dahinter."},
{q:"Im Flur es warten zwei Kunden.",a:"Im Flur warten zwei Kunden.",n:"Wer wartet? Zwei Kunden. Kein es."},
{q:"Im Lager sind es neue Regale.",a:"Im Lager sind neue Regale.",n:"Was ist im Lager? Neue Regale. Kein es."}
]},
{title:"9 · Feste Wendungen",intro:"Diese Ausdrücke lernen wir als ganze Bausteine.\nDas es bleibt immer, auch wenn etwas anderes vorn steht.",task:"Lesen Sie vor und bilden Sie den ganzen Satz.",items:[
{b:1,q:"Worum geht ___ in der Besprechung?",a:"Worum geht es in der Besprechung?",n:"es geht um + Akkusativ"},
{q:"___ kommt darauf an, wann die Ware ankommt.",a:"Es kommt darauf an, wann die Ware ankommt.",n:"es kommt darauf an"},
{q:"___ lohnt sich, die Preise zu vergleichen.",a:"Es lohnt sich, die Preise zu vergleichen.",n:"es lohnt sich"},
{q:"Wir haben ___ mit einem schwierigen Kunden zu tun.",a:"Wir haben es mit einem schwierigen Kunden zu tun.",n:"es mit jemandem zu tun haben"},
{q:"Hier handelt ___ sich um eine dringende Bestellung.",a:"Hier handelt es sich um eine dringende Bestellung.",n:"es handelt sich um: erst es, dann sich."},
{q:"Endlich ist ___ Jonas gelungen, die Datei zu öffnen.",a:"Endlich ist es Jonas gelungen, die Datei zu öffnen.",n:"es ist jemandem gelungen"},
{q:"Worum geht es? Antworten Sie: die neue Rechnung.",a:"Es geht um die neue Rechnung.",n:"um + Akkusativ"},
{q:"Leider fehlt ___ noch an Informationen.",a:"Leider fehlt es noch an Informationen.",n:"es fehlt an + Dativ"},
{q:"Heute geht ___ um die nächste Lieferung.",a:"Heute geht es um die nächste Lieferung.",n:"es geht um: Das es bleibt."},
{q:"Bei diesem Auftrag kommt ___ auf die Frist an.",a:"Bei diesem Auftrag kommt es auf die Frist an.",n:"es kommt auf etwas an"}
]}]];
let li=0,si=0,ii=0,shown=false,interval=null;const $=id=>document.getElementById(id);
function sets(){return levels[li]}
function buildTabs(){$("tabs").innerHTML="";sets().forEach((s,i)=>{let b=document.createElement("button");b.type="button";b.textContent=s.title;b.onclick=()=>{si=i;ii=0;draw()};$("tabs").append(b)});[...$("levels").children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===li)))}
document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>{li=Number(b.dataset.l);si=0;ii=0;buildTabs();draw()});
function setClock(t,zeit){$("clock").textContent=t;$("clock").classList.toggle("zeit",!!zeit)}
function showAnswer(on){shown=on;$("answer").hidden=!on;$("show").textContent=on?"Lösung verbergen":"Lösung zeigen";if(on){clearInterval(interval);setClock("")}}
function draw(){clearInterval(interval);let s=sets()[si],q=s.items[ii];$("count").textContent="Aufgabe "+(ii+1)+" von "+s.items.length;$("heading").textContent=s.title;$("explain").textContent=s.intro;$("instruction").textContent=s.task;
$("vorlage").hidden=!q.v;$("vorlage").textContent=q.v||"";$("task").textContent=q.q;$("solution").textContent=q.a;$("note").textContent=q.n||"";
$("tipp").hidden=true;$("tipp").textContent=q.t?"Tipp: "+q.t:"";$("tippbtn").hidden=!q.t;
$("prev").disabled=ii===0&&si===0;[...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===si)));setClock("");
showAnswer(false);
let seconds=Number($("timer").value);if(seconds){setClock(seconds+" s");interval=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(interval);setClock("Zeit!",true)}else setClock(seconds+" s")},1000)}}
$("show").onclick=()=>showAnswer(!shown);
$("tippbtn").onclick=()=>{$("tipp").hidden=!$("tipp").hidden};
$("prev").onclick=()=>{if(ii>0)ii--;else if(si>0){si--;ii=sets()[si].items.length-1}else return;draw()};
$("next").onclick=()=>{ii++;if(ii>=sets()[si].items.length){si=(si+1)%sets().length;ii=0}draw()};
$("timer").onchange=draw;
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;if(e.code==="Space"){e.preventDefault();$("show").click()}if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});
buildTabs();draw();
</script></body></html>
